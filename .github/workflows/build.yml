name: Patch and Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure Git User Details
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build
        run: ./gradlew build
      - name: Build Paperclip Jar
        run: ./gradlew createMojmapPaperclipJar --stacktrace
      - name: Upload Vertex Server Jar
        uses: actions/upload-artifact@v4
        with:
          name: vertex-server
          path: folia-server/build/libs/*paperclip*.jar
          if-no-files-found: error
      - name: Upload Vertex Engine API
        uses: actions/upload-artifact@v4
        with:
          name: vertex-engine-api
          path: vertex-engine-api/build/libs/*.jar
          if-no-files-found: error

      # Modules build against this coordinate, so it has to exist somewhere they can resolve it
      # from. Only from the default branch: a feature branch republishing 0.1.0 would silently
      # change what every module compiles against.
      - name: Publish Vertex Engine API
        if: github.ref == 'refs/heads/vertex' && github.event_name == 'push'
        run: ./gradlew :vertex-engine-api:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
